<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QuePing QuePong">
<title>QuePing QuePong</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="lobby" class="overlay">
  <div class="panel">
    <canvas id="logo" width="140" height="72"></canvas>
    <p class="sub">Uno o dos jugadores, estilo 16 bits</p>
    <input id="nameInput" type="text" maxlength="16" placeholder="Tu nombre" autocomplete="off">
    <div class="cosmetics">
      <div class="cosmField"><label>Personaje</label><div id="charPicker" class="pickerGrid"></div></div>
      <div class="cosmField"><label>Pala</label><div id="paddlePicker" class="pickerGrid"></div></div>
      <div class="cosmField"><label>Mesa</label><div id="tablePicker" class="pickerGrid"></div></div>
    </div>
    <div class="modeBlock">
      <label>Un jugador</label>
      <div class="modeRow">
        <button class="primary" data-level="easy">Fácil</button>
        <button class="primary" data-level="medium">Medio</button>
        <button class="primary" data-level="hard">Difícil</button>
      </div>
      <p class="hint">Mueve la pala deslizando el dedo (o con ← →). Saca tocando la pantalla (o Espacio).</p>
    </div>
    <div class="modeBlock">
      <label>Dos jugadores</label>
      <div class="modeRow">
        <button id="localBtn">Misma pantalla</button>
        <button id="createBtn">Crear sala online</button>
      </div>
      <p class="hint">Misma pantalla: J1 usa la mitad de abajo (o ← → y Espacio), J2 la de arriba (o A D y W).</p>
      <div class="joinRow">
        <input id="codeInput" type="text" maxlength="4" placeholder="CÓDIGO" autocomplete="off">
        <button id="joinBtn">Unirse</button>
      </div>
    </div>
    <p id="lobbyError" class="error"></p>
  </div>
</div>

<div id="game" class="hidden">
  <header id="hud">
    <button id="exitBtn" title="Salir al menú">←</button>
    <button id="musicBtn" title="Silenciar música (M)">🔊</button>
    <div class="player" id="p0">
      <canvas class="avatar" width="40" height="40"></canvas>
      <span class="pname">—</span>
    </div>
    <div id="center">
      <div id="roomTag" class="hidden">Sala: <b id="roomCode">—</b></div>
      <div id="status"></div>
    </div>
    <div class="player" id="p1">
      <canvas class="avatar" width="40" height="40"></canvas>
      <span class="pname">—</span>
    </div>
  </header>

  <div id="screenWrap">
    <canvas id="screen" width="1152" height="648"></canvas>
    <div id="controls"></div>
    <div id="overMsg" class="hidden">
      <div id="overText"></div>
      <button id="rematchBtn" class="primary">Otra partida</button>
      <button id="menuBtn">Menú</button>
    </div>
  </div>

  <div id="bottom">
    <div id="chat" class="hidden">
      <div id="chatLog"></div>
      <form id="chatForm">
        <input id="chatInput" type="text" maxlength="200" placeholder="Escribe un mensaje…" autocomplete="off">
        <button type="submit">Enviar</button>
      </form>
    </div>
  </div>
</div>

<script src="shared/physics.js"></script>
<script src="shared/cosmetics.js"></script>
<script src="config.js"></script>
<script src="client.js"></script>
</body>
</html>
